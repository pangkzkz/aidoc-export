[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidoc-export"
version = "0.3.0"
description = "Convert LLM answers (Markdown) into DOCX / PDF reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
aidoc-export = "aidoc_export:main"

[tool.setuptools]
py-modules = ["aidoc_export"]
